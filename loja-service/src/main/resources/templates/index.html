<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Observabilidade - Simulador de Eventos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-purple: #a855f7;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent-blue);
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 0.75rem;
        }

        .main-container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 1.75rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            border: none;
            border-radius: 0.75rem;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-view {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
        }

        .btn-view:hover {
            background: linear-gradient(135deg, #075985 0%, #0284c7 100%);
        }

        .btn-cart {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
        }

        .btn-cart:hover {
            background: linear-gradient(135deg, #92400e 0%, #d97706 100%);
        }

        .btn-checkout {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
        }

        .btn-checkout:hover {
            background: linear-gradient(135deg, #166534 0%, #16a34a 100%);
        }

        .price-tag {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .stat-box {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 0.5rem;
            padding: 0.75rem;
            text-align: center;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .logs-container {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--card-border);
            border-radius: 0.5rem;
            height: 220px;
            overflow-y: auto;
            padding: 0.75rem;
            font-family: monospace;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column-reverse;
            gap: 0.5rem;
        }

        .log-item {
            padding: 0.5rem;
            border-radius: 0.375rem;
            background: rgba(30, 41, 59, 0.5);
            border-left: 3px solid var(--accent-blue);
            animation: fadeIn 0.3s ease;
        }

        .log-item.checkout {
            border-left-color: var(--accent-green);
        }

        .log-item.add_to_cart {
            border-left-color: var(--accent-orange);
        }

        .log-time {
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Loja - Produtor de Métricas</h1>
        <p>Simulador de Ações do Usuário para Telemetria em Tempo Real</p>
        <span class="badge">RabbitMQ Fila: metrics.queue | Database: PostgreSQL (storedb)</span>
    </div>

    <div class="main-container">
        <!-- Actions Panel -->
        <div class="card">
            <div class="card-title">
                <span>⚡ Simular Interação</span>
            </div>
            <div class="action-buttons">
                <button class="btn btn-view" onclick="sendAction('view_product', 0.0)">
                    <span>👁️ Visualizar Produto</span>
                    <span class="price-tag">R$ 0,00</span>
                </button>
                <button class="btn btn-cart" onclick="sendAction('add_to_cart', 0.0)">
                    <span>🛒 Adicionar ao Carrinho</span>
                    <span class="price-tag">R$ 0,00</span>
                </button>
                <button class="btn btn-checkout" onclick="sendAction('checkout', 150.0)">
                    <span>💳 Finalizar Compra</span>
                    <span class="price-tag">R$ 150,00</span>
                </button>
            </div>
        </div>

        <!-- Live Feed Panel -->
        <div class="card">
            <div class="card-title">
                <span>📡 Feed de Eventos Enviados</span>
            </div>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-number" id="count-view" th:text="${views != null ? views : 0}">0</div>
                    <div class="stat-label">Views</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="count-cart" th:text="${carts != null ? carts : 0}">0</div>
                    <div class="stat-label">Carrinhos</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="count-checkout" th:text="${checkouts != null ? checkouts : 0}">0</div>
                    <div class="stat-label">Checkouts</div>
                </div>
            </div>

            <div class="logs-container" id="logs">
                <div class="log-item" style="border-left-color: var(--text-secondary);">
                    Aguardando interações... Dados sincronizados com o PostgreSQL.
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const counts = {
            view_product: /*[[${views != null ? views : 0}]]*/ 0,
            add_to_cart: /*[[${carts != null ? carts : 0}]]*/ 0,
            checkout: /*[[${checkouts != null ? checkouts : 0}]]*/ 0
        };

        async function sendAction(actionName, valueAmount) {
            try {
                const response = await fetch('/api/metrics/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: actionName, value: valueAmount })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.views !== undefined) counts.view_product = data.views;
                    if (data.carts !== undefined) counts.add_to_cart = data.carts;
                    if (data.checkouts !== undefined) counts.checkout = data.checkouts;
                    
                    updateStats();
                    addLog(actionName, valueAmount);
                } else {
                    console.error('Erro ao enviar métrica');
                }
            } catch (err) {
                console.error('Erro de rede ao enviar métrica', err);
            }
        }

        function updateStats() {
            document.getElementById('count-view').textContent = counts.view_product;
            document.getElementById('count-cart').textContent = counts.add_to_cart;
            document.getElementById('count-checkout').textContent = counts.checkout;
        }

        function addLog(action, value) {
            const logsContainer = document.getElementById('logs');
            const now = new Date().toLocaleTimeString();
            
            const logItem = document.createElement('div');
            logItem.className = `log-item ${action}`;
            logItem.innerHTML = `
                <div><strong>Event:</strong> <code>${action}</code> (value: ${value})</div>
                <div class="log-time">${now} • Salvo no DB & Enviado ao RabbitMQ</div>
            `;

            logsContainer.prepend(logItem);
        }
    </script>
</body>
</html>
